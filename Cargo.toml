[package]
name = "swingmusix"
version = "2.1.14"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
mime_guess = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unidecode = "0.3"
unicode-normalization = "0.1"
regex = "1"
httpdate = "1"

[profile.release]
strip = true
